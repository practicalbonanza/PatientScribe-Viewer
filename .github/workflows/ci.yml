name: CI

# Runs the same npm script a developer runs locally, so there is one definition
# of the checks and no way for CI and the working copy to drift apart.
#
# This workflow builds nothing and deploys nothing. It uses no secrets and needs
# none: everything it touches is already public. Actions are pinned to full
# commit SHAs — a tag can be moved, a SHA cannot.

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dev tooling
        run: npm ci

      - name: Install test browsers
        run: npm run browsers

      - name: Run all checks
        run: npm run check
