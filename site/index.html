<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://gl9wnq4nh4.execute-api.ap-southeast-2.amazonaws.com https://z5a7itwtg9.execute-api.ap-southeast-2.amazonaws.com; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#faf6ee" />
    <link rel="icon" type="image/png" href="icon.png" />
    <title>Shared note — PatientScribe</title>
    <link rel="stylesheet" href="css/viewer.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main id="viewer-root">
      <div class="masthead">
        <svg class="mark" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true" focusable="false"><rect class="mark-tile" width="64" height="64" rx="14" /><g class="mark-ink" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10H28A8 8 0 0 1 36 18V25A8 8 0 0 1 28 33H24.5L17.5 40.5L20.3 33H17A8 8 0 0 1 9 25V18A8 8 0 0 1 17 10Z" /><polyline points="14.7,22.2 18.8,22.2 20.9,18.4 22.8,26.9 24.7,22.2 28.7,22.2" /><path d="M32.5 53.5L33.6 46L46.6 25.6L52 29.1L39 49.4Z" /><line x1="44.6" y1="28.6" x2="50" y2="32.1" /><line x1="33.6" y1="46" x2="39" y2="49.4" /></g></svg>
        <h1 id="brand"></h1>
      </div>
      <p id="advisory" hidden><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" /><path d="M12 11v5" /><path d="M12 8h.01" /></g></svg><span><span id="advisory-lead"></span><strong id="advisory-emphasis"></strong><span id="advisory-tail"></span></span></p>
      <section id="shell" hidden>
        <p id="shell-intro"></p>
        <p id="code-helper"></p>
        <div id="code-row">
          <label id="code-label" for="code-input"></label>
          <p id="code-hint"></p>
          <input id="code-input" type="text" inputmode="numeric" pattern="[0-9]*" autocapitalize="none" autocorrect="off" aria-describedby="code-hint" />
          <button id="code-submit" type="button"></button>
        </div>
        <p id="wrong-code" role="status"></p>
      </section>
      <div class="ended">
        <p id="unavailable" hidden></p>
        <svg class="ended-art" viewBox="0 0 120 96" width="120" height="96" aria-hidden="true" focusable="false"><g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect class="art-paper" x="30" y="14" width="60" height="72" rx="8" /><path class="art-line" d="M42 34h36M42 46h36M42 58h22" /><circle class="art-badge" cx="84" cy="74" r="15" /><path class="art-hand" d="M84 66v9l5 3" /></g></svg>
      </div>
      <section id="note" hidden>
        <p class="banner"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" /><path d="M12 11v5" /><path d="M12 8h.01" /></g></svg><span id="banner"></span></p>
        <p id="you-chip" hidden></p>
        <p id="edited-chip" hidden></p>
        <p id="visit-date"></p>
        <p id="topic"></p>
        <div id="note-body"></div>
        <p class="expiry"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></g></svg><span id="expiry"></span></p>
        <p class="translate-line"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" /><path d="M3.5 12h17" /><path d="M12 3.5c2.4 2.4 3.5 5.3 3.5 8.5s-1.1 6.1-3.5 8.5c-2.4-2.4-3.5-5.3-3.5-8.5s1.1-6.1 3.5-8.5z" /></g></svg><span id="translate-note"></span></p>
        <p id="get-app"><a id="app-link" href="https://apps.apple.com/au/app/id6758035505"></a></p>
      </section>
      <footer id="footer" hidden>
        <details id="notice">
          <summary class="notice-toggle"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l7 2.8v5.2c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6.3z" /><path d="M9 12l2.2 2.2L15.5 10" /></g></svg><span id="notice-summary"></span><svg class="chevron" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></summary>
          <p id="notice-body"><span id="notice-lead"></span><a id="policy-link" href="https://patientscribe.com.au/privacy-policy"></a><span id="notice-tail"></span></p>
        </details>
        <button id="report" type="button"></button>
      </footer>
    </main>
  </body>
</html>
